name: image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: build, smoke, trivy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cerebro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            GIT_SHA=${{ github.sha }}

      - name: Smoke
        run: ./scripts/smoke.sh cerebro:ci

      - name: Trivy OS
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cerebro:ci
          version: v0.76.2
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy libraries
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cerebro:ci
          version: v0.76.2
          skip-setup-trivy: true
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-libraries.sarif

      - name: Upload library SARIF
        if: always() && hashFiles('trivy-libraries.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-libraries.sarif
          category: trivy-libraries

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:0.10.0
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          build-args: |
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            GIT_SHA=${{ github.sha }}
